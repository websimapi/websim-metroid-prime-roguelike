<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metroid Prime Roguelike</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "nipplejs": "https://esm.sh/nipplejs@0.10.1"
        }
    }
    </script>
</head>
<body>
    <div id="game-container">
        <div id="ui-overlay">
            <div id="health-bar">
                <div id="health-fill"></div>
            </div>
            <div id="energy-bar">
                <div id="energy-fill"></div>
            </div>
            <div id="crosshair">+</div>
            <div id="mobile-controls">
                <div id="joystick-zone"></div>
                <button id="shoot-btn">FIRE</button>
                <button id="jump-btn">JUMP</button>
                <button id="scan-btn">SCAN</button>
            </div>
            <div id="minimap"></div>
        </div>
        <div id="loading-screen">
            <div id="loading-text">INITIALIZING SCAN...</div>
            <div id="loading-bar">
                <div id="loading-fill"></div>
            </div>
        </div>
        <div id="menu-screen">
            <h1>METROID PRIME</h1>
            <h2>ROGUELIKE</h2>
            <button id="start-btn">START MISSION</button>
            <button id="settings-btn">SETTINGS</button>
        </div>
    </div>
    <script type="module" src="game.js"></script>
